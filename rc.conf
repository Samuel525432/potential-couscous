# ===================================================================
# Ranger Configuration File for NeXTSTEP 3.0 Gentoo Rice
# Place this file at: ~/.config/ranger/rc.conf
# ===================================================================

# --- Miller Columns Layout ---
# Simulates the legendary NeXTSTEP multi-column spatial directory browser
set column_ratios 1,3,4,4

# --- NeXTSTEP Minimalist Aesthetics ---
# Strip away modern Linux terminal layout elements to mimic a dedicated GUI window
set draw_borders false
set status_bar false
set draw_progress_bar_in_status_bar false
set padding_right false

# --- General View Settings ---
set show_hidden false
set confirm_on_delete multiple
set automatically_count_files true
set open_all_images true

# --- Disable Modern Features (Too modern for a 1993 workstation) ---
set vcs_aware false
set vcs_backend_git enabled
set preview_images false
set preview_images_method w3m
set preview_directories true
set collapse_preview true
set preview_files true

# --- Mouse Support ---
# Allows navigating columns via clicks just like the original NextStep File Viewer
set mouse_enabled true

# --- Keybindings Alignment ---
# Standard navigational controls remain, keeping the UI completely clean
alias e edit
alias q quit